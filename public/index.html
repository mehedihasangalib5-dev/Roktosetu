<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f6;--card:#fff;--tx:#1c1416;--mut:#6f6266;--bd:#eadfe0;--ac:#d4213a;--ac2:#ff5a5f;--ok:#12a36b;--warn:#e88a00;--sh:0 1px 2px rgba(120,20,35,.04),0 20px 40px -14px rgba(120,20,35,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d0f;--card:#1f1518;--tx:#f6eeef;--mut:#a89599;--bd:#33232a;--sh:0 1px 2px rgba(0,0,0,.3),0 20px 40px -14px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#140d0f;--card:#1f1518;--tx:#f6eeef;--mut:#a89599;--bd:#33232a;--sh:0 1px 2px rgba(0,0,0,.3),0 20px 40px -14px rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% -8%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 42%),radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--ac2) 8%,transparent),transparent 38%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:"Plus Jakarta Sans","Noto Sans Bengali",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
[lang="bn"] body,body:lang(bn){font-family:"Noto Sans Bengali","Plus Jakarta Sans",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.3px;margin-right:auto}
.drop{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,var(--ac2),var(--ac));box-shadow:0 4px 12px rgba(212,33,58,.4)}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:50%;width:38px;height:38px;cursor:pointer;flex:none;transition:.18s cubic-bezier(.2,.8,.2,1)}
.ic:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 16px rgba(120,20,35,.12)}
.ic:active{transform:translateY(0) scale(.92)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center}
.bottomnav .barin{display:flex;align-items:flex-end;gap:2px;width:100%;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--bd);padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px))}
.bottomnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:14px;cursor:pointer;color:var(--mut);font-size:10.5px;font-weight:700;transition:.15s}
.bottomnav button .ico{font-size:19px;line-height:1;transition:transform .18s cubic-bezier(.2,.8,.2,1)}

.bottomnav button.on{color:var(--ac)}

.bottomnav button.mid .ico{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 6px 16px rgba(212,33,58,.45);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.bottomnav button.mid:hover .ico{transform:translateY(-3px) scale(1.05);box-shadow:0 10px 22px rgba(212,33,58,.55)}
.bottomnav button.mid:active .ico{transform:scale(.9)}
.bottomnav button.mid .lbl{color:var(--tx)}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media(min-width:761px){

}

.avwrap .cam{position:absolute;right:-3px;bottom:-2px;width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;display:grid;place-items:center;font-size:12px;border:2.5px solid var(--bg);cursor:pointer;box-shadow:0 4px 10px rgba(212,33,58,.4);transition:.18s cubic-bezier(.2,.8,.2,1)}

.donor-id{color:var(--mut);font-size:12px;margin:1px 0 6px}
.pill.verified{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 85%,#ffb020),var(--ac));color:#fff;font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:99px;box-shadow:0 5px 12px rgba(212,33,58,.3)}

.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}

.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 4px;cursor:pointer;color:var(--tx);font-size:14.5px;font-weight:600;border-bottom:1px solid var(--bd);border-radius:10px;transition:.15s}
.setrow:hover{background:color-mix(in srgb,var(--ac) 6%,transparent)}

.setrow .picon{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.setrow:last-child{border-bottom:0}
.setrow span.si{font-size:17px;width:22px;text-align:center}
.setrow .picon{margin:0}
.setrow .stxt{flex:1}
.setrow .chev{color:var(--mut);font-size:12.5px;font-weight:600;flex:none}
.sechead{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:18px 4px 8px}
.pill.blood{background:color-mix(in srgb,var(--ac) 13%,transparent);color:var(--ac)}
.editHead{display:flex;align-items:center;gap:12px;max-width:640px;margin:18px auto 6px}
.editHead .back{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--bd);cursor:pointer;font-size:16px;flex:none;display:grid;place-items:center}
.editHead h2{margin:0;flex:1;text-align:center;font-size:20px;margin-right:38px}
.phgrp{display:flex;gap:8px}
.phgrp .flag{flex:none;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:0 12px;font-weight:700;font-size:14px;color:var(--mut)}
.phgrp input{flex:1}
.successcard{max-width:420px;text-align:center;position:relative;overflow:hidden;padding:34px 24px}
.successcard .dot{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--ac) 35%,transparent)}
.successcard .chkwrap{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--ac2),var(--ac));display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 10px 26px rgba(212,33,58,.4);position:relative;z-index:1}
.successcard .chkwrap span{color:#fff;font-size:32px}
.successcard h3{margin:0 0 10px;font-size:22px;position:relative;z-index:1}
.successcard p{color:var(--mut);margin:0 0 22px;position:relative;z-index:1}
.pcard{padding:0;overflow:hidden;text-align:left}
.pbanner{height:58px;background:linear-gradient(120deg,var(--ac) 0%,var(--ac2) 55%,#ffb020 100%);position:relative;overflow:hidden}
.pbanner:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.15) 100%)}
.pcard-body{padding:0 14px 14px}
.pcard-head{display:flex;align-items:flex-end;gap:10px;margin-top:-32px;flex-wrap:wrap}
.pcard-head .avwrap{margin:0;flex:none}
.pcard-id{flex:1;min-width:0;padding-bottom:2px}
.pcard-head .btn{flex:none;align-self:flex-start;margin-top:8px}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-card{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:.18s}
.field-card .fl{display:block;font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.field-card b{font-size:13px;font-weight:700}
.field-card:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.sw{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;cursor:pointer;inset:0;background:var(--bd);border-radius:99px;transition:.2s}
.sw i:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--ac)}
.sw input:checked+i:before{transform:translateX(14px)}
@media(min-width:900px){
  .profwrap{max-width:820px!important}
  .fields-grid{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:400px){
  .avwrap{width:64px;height:64px}
  .avwrap img,.avwrap .bg{width:64px;height:64px;font-size:22px}

  .pcard-head{margin-top:-26px}
  .pcard-id b{font-size:15px!important}
  .fields-grid{grid-template-columns:1fr 1fr;gap:7px}

}
.langbtn{background:var(--card);border:1px solid var(--bd);border-radius:99px;height:38px;padding:0 13px;cursor:pointer;font-weight:700;flex:none;font-size:13px}
#installBtn{display:none}
#offbar{display:none;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:19;background:var(--warn);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:6px}
#offbar.on{display:block}
.hero{padding:44px 0 20px;display:grid;gap:28px;grid-template-columns:1.2fr .8fr;align-items:center}
.hero-art{position:relative;aspect-ratio:1/1;max-width:320px;width:100%;margin:0 auto}
.hero-art svg{width:100%;height:100%;overflow:visible}
.hero-art .blob{opacity:.16}
.hero-art .b1{fill:var(--ac)}
.hero-art .b2{fill:var(--ac2)}
.hero-art .drop{filter:drop-shadow(0 18px 28px rgba(212,33,58,.35))}
.hero-art .pulse{stroke:#fff}
.hero-art .node circle{fill:var(--card);stroke:var(--bd);stroke-width:1.5}
.hero-art .node text{font-size:18px}
.hero-art .link{stroke:var(--bd);stroke-width:2}
.hero-art .n1{animation:floaty 4s ease-in-out infinite}
.hero-art .n2{animation:floaty 5s ease-in-out infinite .4s}
.hero-art .n3{animation:floaty 4.5s ease-in-out infinite .8s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media(max-width:760px){.hero-art{display:none}}
h1{font-size:clamp(30px,5vw,50px);line-height:1.08;letter-spacing:-1.5px;margin:0 0 14px;font-weight:800}

.lead{color:var(--mut);font-size:17px;max-width:520px;margin:0 0 22px;line-height:1.6}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;box-shadow:0 6px 18px rgba(212,33,58,.3);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,filter .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(212,33,58,.4);filter:brightness(1.04)}
.btn:active{transform:translateY(0) scale(.96);box-shadow:0 4px 10px rgba(212,33,58,.35)}
.btn.gh{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.gh:hover{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 6%,var(--card));transform:translateY(-2px);box-shadow:0 8px 18px rgba(120,20,35,.12)}
.btn.gh:active{transform:translateY(0) scale(.96)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}

.stat.compact b{font-size:20px}
.stat.compact small{font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.04)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.listcard{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.listcard:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(120,20,35,.16)}
.sk{background:linear-gradient(90deg,color-mix(in srgb,var(--bd) 60%,transparent) 25%,color-mix(in srgb,var(--bd) 100%,transparent) 37%,color-mix(in srgb,var(--bd) 60%,transparent) 63%);background-size:400% 100%;border-radius:8px;animation:shimmer 1.4s ease infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

#app.page-in{animation:pagein .34s cubic-bezier(.2,.85,.25,1)}

.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.admin-stats .stat{padding:15px}

.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.arow{display:flex;align-items:center;gap:12px;padding:13px 14px}
.arow:hover{background:color-mix(in srgb,var(--ac) 5%,transparent)}
.pending-row{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--bd));background:color-mix(in srgb,var(--warn) 6%,var(--card))}
h2{font-size:26px;letter-spacing:-.6px;margin:30px 0 6px;font-weight:800}
h3{font-size:18px;letter-spacing:-.3px;font-weight:700;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:14.5px}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
label{font-size:12.5px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px;letter-spacing:.15px;transition:color .18s,transform .18s}

input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 15%,transparent)}

.bg{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--ac2),var(--ac));flex:none}
.row{display:flex;gap:12px;align-items:center}

  reader.onload=e=>{const img=new Image();img.onload=()=>{

    PENDING_PHOTO=url;
    if(S.me)updateDoc(doc(db,"donors",user.uid),{photo:url}).then(()=>toast(t("photo_updated"))).catch(fe);

    render();
  };img.src=e.target.result};
  reader.readAsDataURL(f);
}

  setDoc(doc(db,"donors",user.uid),{name:n,g:v("d_g"),d:v("d_d"),ph:p,lastMs,av:S.me?S.me.av:true,off,uid:user.uid,...(photo?{photo}:{}),...(LOC.d?{lat:r2(LOC.d[0]),lng:r2(LOC.d[1])}:{})}).then(()=>{PENDING_PHOTO=null;profileEdit=false;go("profile");showUpdated(isNew)}).catch(fe);
}

async function pwReset(){
  if(!user||!user.email||user.email.endsWith("@phone.roktosetu.app"))return toast(t("settings_pw_nomail"));
  try{await sendPasswordResetEmail(auth,user.email);toast(t("settings_pw_sent"))}catch(x){ae(x)}
}
view=(location.hash||"#home").slice(1);if(!TABS.some(t=>t[0]===view)&&view!=="admin")view="home";
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!==view&&(TABS.some(t=>t[0]===h)||h==="admin")){view=h;render()}});
Object.assign(window,{go,chart,loc,postReq,respond,fulfil,matchList,closeM,regDonor,delMe,toggleAv,setMode,doLogin,doRegister,forgot,googleIn,signOutU,setF,useGps,setD,goDir,addFac,stockM,saveStock,verifyFac,delFac,doInstall,F,render,setProfileEdit,openSettings,toggleTheme,pwReset,uploadAvatar,showUpdated,setAV,adminDelDonor,adminToggleReq,adminDelReq});

addEventListener("appinstalled",()=>{deferredInstall=null;render()});
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;render()}

function syncOffline(){const b=$("#offbar");if(!b)return;b.textContent=t("offline");b.classList.toggle("on",!navigator.onLine)}
addEventListener("online",syncOffline);addEventListener("offline",syncOffline);

if("serviceWorker" in navigator && location.hostname!=="localhost" && location.protocol==="https:"){
  addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
if(CONFIGURED){app=initializeApp(firebaseConfig);try{getAnalytics(app)}catch(e){}auth=getAuth(app);db=getFirestore(app);
  onAuthStateChanged(auth,u=>{user=u;unsubs.forEach(f=>f());unsubs=[];S={donors:[],reqs:[],facs:[],me:null,loaded:{donors:false,reqs:false,facs:false}};isAdmin=false;if(u){listen();getDoc(doc(db,"admins",u.uid)).then(d=>{isAdmin=d.exists();render()}).catch(()=>{})}render()})}
render();
